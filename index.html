<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#e85d04">
  <meta name="description" content="记录会做的菜，不知道吃什么就来翻一翻">
  <title>我的菜单</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="header">
    <h1 class="header__title">🍳 我的菜单</h1>
    <p class="header__subtitle">记录会做的菜，下次不用愁</p>
    <div class="header__user" id="headerUser" hidden>
      <span class="header__email" id="headerEmail"></span>
      <button type="button" class="header__logout" id="btnLogout">退出</button>
    </div>
  </header>

  <main class="main">
    <section class="toolbar">
      <button type="button" class="btn btn--primary" id="btnRandom">
        <span class="btn__icon">🎲</span> 随机一道
      </button>
      <button type="button" class="btn btn--accent" id="btnAdd">
        <span class="btn__icon">➕</span> 添加菜品
      </button>
    </section>

    <section class="filters">
      <div class="search-wrap">
        <input type="search" class="search" id="searchInput" placeholder="搜索菜名…" autocomplete="off">
      </div>
      <div class="categories" id="categoryFilters" role="tablist"></div>
    </section>

    <section class="dish-list" id="dishList" aria-live="polite"></section>
    <p class="empty-state" id="emptyState" hidden>还没有菜品，点「添加菜品」录入第一道菜吧</p>
  </main>

  <!-- 随机结果 -->
  <dialog class="modal" id="randomModal">
    <div class="modal__content random-result">
      <p class="random-result__label">今天吃</p>
      <h2 class="random-result__name" id="randomName"></h2>
      <span class="tag" id="randomCategory"></span>
      <div class="random-result__photo" id="randomPhoto" hidden>
        <img id="randomImg" alt="">
      </div>
      <div class="modal__actions">
        <button type="button" class="btn btn--ghost" id="btnRandomAgain">再抽一次</button>
        <button type="button" class="btn btn--primary" id="btnRandomClose">就这个！</button>
      </div>
    </div>
  </dialog>

  <!-- 添加/编辑 -->
  <dialog class="modal" id="dishModal">
    <form class="modal__content dish-form" id="dishForm">
      <h2 class="modal__title" id="dishModalTitle">添加菜品</h2>

      <div class="photo-area" id="photoArea">
        <input type="file" id="cameraInput" accept="image/*" capture="environment" hidden>
        <input type="file" id="uploadInput" accept="image/*" hidden>
        <div class="photo-preview" id="photoPreview" hidden>
          <img id="photoImg" alt="菜品照片">
          <div class="photo-preview__actions">
            <button type="button" class="photo-preview__btn" id="btnChangePhoto">更换</button>
            <button type="button" class="photo-preview__btn" id="btnRemovePhoto">删除图片</button>
          </div>
        </div>
        <div class="photo-placeholder" id="photoPlaceholder">
          <span class="photo-placeholder__icon">🖼</span>
          <span>添加菜品图片（可选）</span>
          <div class="photo-actions">
            <button type="button" class="btn btn--ghost photo-action-btn" id="btnCamera">📷 拍照</button>
            <button type="button" class="btn btn--ghost photo-action-btn" id="btnUpload">📁 上传图片</button>
          </div>
          <span class="photo-placeholder__hint">上传后可点「AI 识图」自动填菜名和分类</span>
        </div>
      </div>

      <button type="button" class="btn btn--ghost btn--full" id="btnAnalyze" hidden>✨ AI 识图填名</button>
      <div class="analyze-status" id="analyzeStatus" hidden></div>

      <label class="field">
        <span class="field__label">菜名</span>
        <input type="text" class="field__input" id="dishName" required placeholder="例如：番茄炒蛋" maxlength="50">
      </label>

      <label class="field">
        <span class="field__label">分类</span>
        <select class="field__input" id="dishCategory" required></select>
      </label>

      <div class="modal__actions">
        <button type="button" class="btn btn--ghost" id="btnCancelDish">取消</button>
        <button type="submit" class="btn btn--primary" id="btnSaveDish">保存</button>
      </div>
    </form>
  </dialog>

  <!-- 查看详情 -->
  <dialog class="modal" id="detailModal">
    <div class="modal__content detail-view">
      <div class="detail-view__photo" id="detailPhoto" hidden>
        <img id="detailImg" alt="">
      </div>
      <h2 class="detail-view__name" id="detailName"></h2>
      <span class="tag" id="detailCategory"></span>
      <p class="detail-view__meta" id="detailMeta"></p>
      <div class="modal__actions detail-view__actions">
        <button type="button" class="btn btn--ghost" id="btnDetailDelete">删除</button>
        <button type="button" class="btn btn--ghost" id="btnDetailEdit">编辑</button>
        <button type="button" class="btn btn--primary" id="btnDetailClose">关闭</button>
      </div>
    </div>
  </dialog>

  <!-- 登录/注册 -->
  <dialog class="modal auth-modal" id="authModal">
    <div class="modal__content auth-form">
      <h2 class="modal__title" id="authTitle">登录账号</h2>
      <p class="auth-form__hint">登录后菜品和图片会同步到云端，任意设备都能查看</p>

      <div class="auth-tabs">
        <button type="button" class="auth-tab auth-tab--active" id="authTabLogin" data-mode="login">登录</button>
        <button type="button" class="auth-tab" id="authTabRegister" data-mode="register">注册</button>
      </div>

      <form id="authForm">
        <label class="field">
          <span class="field__label">邮箱</span>
          <input type="email" class="field__input" id="authEmail" required placeholder="your@email.com" autocomplete="username">
        </label>
        <label class="field">
          <span class="field__label">密码</span>
          <input type="password" class="field__input" id="authPassword" required placeholder="至少 6 位" minlength="6" autocomplete="current-password">
        </label>
        <div class="auth-status" id="authStatus" hidden></div>
        <button type="submit" class="btn btn--primary btn--full" id="btnAuthSubmit">登录</button>
      </form>
    </div>
  </dialog>

  <!-- 设置 -->
  <button type="button" class="fab-settings" id="btnSettings" title="设置">⚙️</button>

  <dialog class="modal" id="settingsModal">
    <div class="modal__content">
      <h2 class="modal__title">备份</h2>
      <p class="field__hint" style="margin-bottom:16px">导出或导入菜品数据（JSON 格式）</p>

      <div class="settings-actions">
        <button type="button" class="btn btn--ghost" id="btnExport">导出备份</button>
        <button type="button" class="btn btn--ghost" id="btnImport">导入备份</button>
        <input type="file" id="importInput" accept=".json" hidden>
      </div>

      <div class="modal__actions">
        <button type="button" class="btn btn--primary" id="btnCloseSettings">关闭</button>
      </div>
    </div>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
